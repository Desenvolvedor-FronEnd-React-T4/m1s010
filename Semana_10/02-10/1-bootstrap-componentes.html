<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bootstrap — componentes prontos via CDN</title>
<!-- Nada para instalar: só os links do CDN, iguais aos do slide
     "INCLUINDO O BOOTSTRAP (CDN)". -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<!-- O nosso CSS entra DEPOIS do Bootstrap, para poder complementar as
     classes dele quando for preciso (ver 3-customizar-botao-bootstrap.html). -->
<link rel="stylesheet" href="1-bootstrap-componentes.css">
</head>
<body class="pagina-bootstrap-demo">

  <h1 class="titulo-demo">Bootstrap: botão, card e grid de 12 colunas</h1>

  <!-- Botão pronto: a classe "btn" dá o formato, "btn-warning" dá a cor. -->
  <button class="btn btn-warning">Enviar</button>

  <!-- Card pronto: título + texto, com espaçamento e borda já definidos. -->
  <div class="card mt-3 card-exemplo">
    <div class="card-body">
      <h5 class="card-title">Rio de Janeiro</h5>
      <p class="card-text">Seg a Dom, 08h às 18h.</p>
    </div>
  </div>

  <!--
    Grid do Bootstrap: 12 colunas, responsivo de fábrica.
    "col-md-6" = metade da largura a partir de telas médias (≥768px);
    no celular, cada .col-md-6 ocupa 100% da largura e empilha sozinho —
    sem escrever nenhuma media query.
  -->
  <h2 class="subtitulo-demo">Grid de 12 colunas</h2>
  <div class="container mt-2">
    <div class="row">
      <div class="col-md-6 col-loja">Loja RJ</div>
      <!-- "mt-2" é a própria classe utilitária do Bootstrap para margin-top,
           usada aqui em vez de um style customizado. -->
      <div class="col-md-6 col-loja mt-2">Loja SP</div>
    </div>
  </div>

  <!--
    EXERCÍCIO RÁPIDO:
      1) redimensione a janela (ou DevTools em modo dispositivo) e veja o
         grid empilhar no celular e virar 2 colunas no desktop, de graça;
      2) troque "btn-warning" por "btn-primary" e "btn-danger" e compare;
      3) troque "col-md-6" por "col-md-4" e adicione uma terceira loja.
  -->

</body>
</html>
