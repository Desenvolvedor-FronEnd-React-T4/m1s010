<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exercício — customizar o Bootstrap sem !important</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<!-- O nosso CSS entra DEPOIS do Bootstrap — ver a explicação no arquivo. -->
<link rel="stylesheet" href="3-customizar-botao-bootstrap.css">
</head>
<body>

  <h1 class="titulo-demo">Customizando um botão do Bootstrap</h1>

  <!-- A ordem das classes no HTML não importa para o CSS — o que importa
       é a ORDEM dos <link> no <head> e a ESPECIFICIDADE de cada seletor.
       Aqui, ".btn-bikcraft" e ".btn" têm a mesma especificidade (10, uma
       classe cada); como o <link> do nosso CSS vem DEPOIS do <link> do
       Bootstrap, a nossa regra vence pela cascata. -->
  <button class="btn btn-bikcraft">Enviar mensagem</button>

  <p class="texto-legenda">
    Este é o mesmo botão usado de verdade em
    <code>Bikcraft_Gabarito/contato.html</code> — confira lá o resultado
    aplicado à página completa.
  </p>

</body>
</html>
