<title>Bikcraft — Catálogo responsivo (exercício)</title>

<link rel="stylesheet" href="4-exercicio-catalogo-responsivo.css">

<body>

  <header class="cabecalho">
    <span class="logo">bikcraft</span>
    <h1 class="titulo">nossas bicicletas.</h1>
  </header>

  <main class="catalogo">
    <article class="card">
      <img src="assets/bike-1.svg" alt="Bikcraft Sport">
      <h2>Bikcraft Sport</h2>
      <p>Leve e veloz, ideal para a cidade.</p>
    </article>

    <article class="card">
      <img src="assets/bike-2.svg" alt="Bikcraft Urban">
      <h2>Bikcraft Urban</h2>
      <p>Conforto para o trabalho, com cestinha.</p>
    </article>

    <article class="card">
      <img src="assets/bike-3.svg" alt="Bikcraft Cargo">
      <h2>Bikcraft Cargo</h2>
      <p>Robusta, feita para longas distâncias.</p>
    </article>
  </main>

</body>
</html>
