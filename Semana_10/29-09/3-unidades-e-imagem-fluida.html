<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unidades relativas e imagem fluida</title>
<link rel="stylesheet" href="3-unidades-e-imagem-fluida.css">
</head>
<body>

  <h2>Unidades: px × % × rem × vw</h2>

  <div class="caixa-px">Largura fixa: 300px (sempre igual, em qualquer tela)</div>
  <div class="caixa-pct">Largura relativa: 50% do pai</div>
  <div class="banner-vw">Padding relativo à tela: 5vw</div>

  <h2 class="titulo-secundario">Imagem fluida</h2>
  <div class="foto-fluida">
    <img src="../../Bikcraft_Gabarito/assets/bike-1.svg" alt="Exemplo de imagem fluida">
  </div>

  <!--
    EXERCÍCIO RÁPIDO — redimensione a janela do navegador (ou abra o
    DevTools em modo dispositivo) e observe:
      - a caixa "px" nunca muda de tamanho;
      - a caixa "%" muda de tamanho junto com a tela;
      - o banner "vw" muda o padding conforme a largura da tela;
      - a imagem nunca ultrapassa a largura do container, em nenhuma tela.
  -->

</body>
</html>
