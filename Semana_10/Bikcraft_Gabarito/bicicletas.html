<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bikcraft — escolha a sua</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<!-- SEMANA 08 — id na página inteira, para o desafio de seleção via JS
     (document.getElementById) pedir "a página de escolha da bicicleta". -->
<body id="pagina-bicicletas" class="pagina-bicicletas">

  <header class="cabecalho">
    <span class="logo">bikcraft</span>
    <nav>
      <a href="bicicletas.html">Bicicletas</a>
      <a href="#seguros">Seguros</a>
      <a href="contato.html">Contato</a>
    </nav>
  </header>

  <main>
    <h1 class="titulo-secao">escolha a sua</h1>

    <!--
      SEMANA 08 — cada bicicleta é um <article> com:
        - um id único (bike-1, bike-2, bike-3) para pegar UMA bike específica
        - a classe compartilhada "card-bicicleta" para pegar TODAS de uma vez
        - os dados de nome e preço em elementos com classe própria, para o
          script.js conseguir ler cada informação separadamente.
      Isso é o que o desafio da Semana 08 pede: aplicar id e classes ao HTML
      "se necessário" — e aqui é necessário, porque o script busca cada bike
      tanto individualmente (bike 1) quanto em conjunto (todas).
    -->
    <div class="grade-bicicletas">

      <article id="bike-1" class="card-bicicleta">
        <img class="imagem-bike" src="assets/bike-1.svg" alt="Bicicleta Magic Might">
        <div class="info-card">
          <p class="nome-bike">Magic Might</p>
          <p class="preco-bike" data-preco="2499">R$ 2499</p>
        </div>
      </article>

      <article id="bike-2" class="card-bicicleta">
        <img class="imagem-bike" src="assets/bike-2.svg" alt="Bicicleta Nimbus Stark">
        <div class="info-card">
          <p class="nome-bike">Nimbus Stark</p>
          <p class="preco-bike" data-preco="4999">R$ 4999</p>
        </div>
      </article>

      <article id="bike-3" class="card-bicicleta">
        <img class="imagem-bike" src="assets/bike-3.svg" alt="Bicicleta Nebula Cosmic">
        <div class="info-card">
          <p class="nome-bike">Nebula Cosmic</p>
          <p class="preco-bike" data-preco="3999">R$ 3999</p>
        </div>
      </article>

    </div>
  </main>

  <footer class="rodape" style="border-top:1px solid #e5e5e5;color:#6b6b6b">
    <p>&copy; 2026 Bikcraft. Todos os direitos reservados.</p>
    <div class="redes-sociais" style="color:#111">
      <a href="#" aria-label="Instagram"><i class="fa-brands fa-instagram"></i></a>
      <a href="#" aria-label="Facebook"><i class="fa-brands fa-facebook"></i></a>
      <a href="#" aria-label="YouTube"><i class="fa-brands fa-youtube"></i></a>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
